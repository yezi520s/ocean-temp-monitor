<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>海洋温度异常预警监测平台</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet.css') }}" />
<script src="{{ url_for('static', filename='vendor/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/echarts.min.js') }}"></script>
<style>
/* ====== 全局重置 ====== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep: #020b1a;
  --bg-panel: rgba(8, 24, 58, 0.65);
  --border-glass: rgba(64, 158, 255, 0.15);
  --text-primary: #e8f0fe;
  --text-secondary: #89a4c7;
  --text-muted: #4a6580;
  --blue-glow: #3b9eff;
  --blue-light: #5eb8ff;
  --green: #00e396;
  --green-glow: rgba(0,227,150,0.4);
  --orange: #ffa940;
  --orange-glow: rgba(255,169,64,0.4);
  --red: #ff4757;
  --red-glow: rgba(255,71,87,0.5);
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: radial-gradient(ellipse at 50% 0%, #0a1e3d 0%, #020b1a 70%);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ====== 主容器层级 ====== */
.app {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
}

/* ====== 顶部栏 ====== */
.header {
  position: relative; z-index: 10;
  padding: 18px 32px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(8, 20, 50, 0.92);
  border-bottom: 1px solid rgba(64, 158, 255, 0.1);
}
.header-brand { display: flex; align-items: center; gap: 14px; }
.header-icon {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, #1a5fb4, #3584e4);
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  box-shadow: 0 0 24px rgba(53,132,228,0.35);
  animation: iconGlow 3s ease-in-out infinite;
}
@keyframes iconGlow {
  0%, 100% { box-shadow: 0 0 24px rgba(53,132,228,0.35); }
  50% { box-shadow: 0 0 40px rgba(53,132,228,0.6); }
}
.header-title h1 {
  font-size: 22px; font-weight: 700; letter-spacing: 1px;
  background: linear-gradient(135deg, #c4e0ff 0%, #7cb8ff 40%, #3b9eff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header-title span {
  font-size: 11px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase;
}
.header-right { display: flex; align-items: center; gap: 16px; }
.clock {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 20px;
  background: rgba(255,255,255,0.04); font-size: 13px; color: var(--text-secondary);
  border: 1px solid rgba(255,255,255,0.06);
}
.clock .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.btn {
  padding: 10px 22px; border: none; border-radius: 24px; cursor: pointer;
  font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  position: relative; overflow: hidden;
}
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
  transform: translateX(-100%); transition: transform 0.5s;
}
.btn:hover::after { transform: translateX(100%); }
.btn-secondary {
  background: rgba(59,158,255,0.12); color: var(--blue-light);
  border: 1px solid rgba(59,158,255,0.25);
}
.btn-secondary:hover {
  background: rgba(59,158,255,0.22); border-color: rgba(59,158,255,0.45);
  box-shadow: 0 0 20px rgba(59,158,255,0.2); transform: translateY(-1px);
}
.btn-amber {
  background: rgba(255,169,64,0.12); color: var(--orange);
  border: 1px solid rgba(255,169,64,0.25);
}
.btn-amber:hover {
  background: rgba(255,169,64,0.22); border-color: rgba(255,169,64,0.45);
  box-shadow: 0 0 20px rgba(255,169,64,0.2); transform: translateY(-1px);
}
.btn:active { transform: scale(0.96); }

/* ====== 主网格 ====== */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px; padding: 20px;
  flex: 1; min-height: 0;
}

/* ====== 玻璃拟态面板 ====== */
.glass {
  background: rgba(8, 24, 58, 0.85);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.03);
  transition: border-color 0.3s, box-shadow 0.3s;
}
.glass:hover { border-color: rgba(64, 158, 255, 0.25); }

/* ====== 统计卡片 ====== */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.stat-card {
  position: relative; padding: 20px; overflow: hidden; cursor: default;
  transition: transform 0.3s, box-shadow 0.3s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05); }
.stat-card .stat-icon {
  font-size: 28px; margin-bottom: 10px; display: block;
}
.stat-card .stat-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 6px;
}
.stat-card .stat-value { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
.stat-card .stat-footnote { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.stat-card .stat-accent {
  position: absolute; top: -30px; right: -30px; width: 100px; height: 100px; border-radius: 50%;
  filter: blur(40px); opacity: 0.4;
}
.accent-green { background: rgba(0,227,150,0.5); }
.accent-orange { background: rgba(255,169,64,0.5); }
.accent-red { background: rgba(255,71,87,0.5); }
.accent-blue { background: rgba(59,158,255,0.5); }

/* 数字跳动动画 */
@keyframes countPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
.num-animate { animation: countPop 0.4s ease-out; }

/* ====== 地图容器 ====== */
.map-wrap {
  flex: 1; min-height: 0; overflow: hidden; position: relative;
  border-radius: var(--radius-lg);
  background: rgba(8, 24, 58, 0.85);
  border: 1px solid var(--border-glass);
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
#map { width: 100%; height: 100%; }
.leaflet-container { background: #051030 !important; }
/* 暗色地图滤镜 */
.leaflet-container { background: #051030 !important; }

/* 自定义地图标记 */
.marker-pin {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; border: 2.5px solid rgba(255,255,255,0.9);
  transition: all 0.3s; cursor: pointer; position: relative;
}
.marker-pin::after {
  content: ''; position: absolute; inset: -6px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.3);
  animation: markerRipple 2s infinite;
}
.marker-pin:hover { transform: scale(1.2); z-index: 999; }
@keyframes markerRipple {
  0% { inset: -6px; opacity: 0.6; }
  100% { inset: -20px; opacity: 0; }
}

/* ====== 右侧面板 ====== */
.side-panel { display: flex; flex-direction: column; gap: 16px; min-height: 0; }

/* 预警报告面板 */
.report-section { padding: 20px; flex: 0 0 auto; max-height: 45%; overflow-y: auto; }
.report-section h3 {
  font-size: 15px; font-weight: 700; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px; color: var(--text-primary);
}
.report-score {
  font-size: 12px; padding: 2px 10px; border-radius: 12px;
  background: rgba(59,158,255,0.2); color: var(--blue-light); font-weight: 700;
}
.report-summary {
  font-size: 12px; color: var(--text-secondary); line-height: 1.7;
  margin-bottom: 10px; padding: 10px 12px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
}
.report-stations { max-height: 200px; overflow-y: auto; }
.report-station-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  font-size: 11px; color: var(--text-secondary); border-radius: 6px;
}
.report-station-row:hover { background: rgba(255,255,255,0.04); }
.report-station-row .rs-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.report-station-row .rs-score { font-weight: 700; }
.rs-level { font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 700; }
.rs-level.normal { background: rgba(0,227,150,0.15); color: var(--green); }
.rs-level.watch { background: rgba(59,158,255,0.15); color: var(--blue-light); }
.rs-level.warning { background: rgba(255,169,64,0.15); color: var(--orange); }
.rs-level.danger { background: rgba(255,71,87,0.2); color: var(--red); }

/* 告警面板 */
.alert-section { padding: 20px; flex: 1 1 120px; overflow-y: auto; min-height: 80px; }
.alert-section h3 {
  font-size: 15px; font-weight: 700; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px; color: var(--text-primary);
}
.alert-count {
  font-size: 12px; padding: 2px 10px; border-radius: 12px;
  background: rgba(255,71,87,0.2); color: var(--red); font-weight: 700;
  min-width: 22px; text-align: center;
}
.alert-empty {
  text-align: center; padding: 40px 20px; color: var(--text-muted);
}
.alert-empty .icon { font-size: 36px; margin-bottom: 10px; }
.alert-item {
  padding: 14px 16px; margin-bottom: 10px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
  border-left: 3px solid var(--orange);
  animation: slideIn 0.4s ease-out; transition: all 0.3s;
}
.alert-item:hover { background: rgba(255,255,255,0.05); transform: translateX(3px); }
.alert-item.lv-danger { border-left-color: var(--red); background: rgba(255,71,87,0.06); }
.alert-item.lv-info { border-left-color: var(--blue-glow); }
.alert-item .al-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px;
  font-weight: 700; letter-spacing: 0.5px; margin-right: 6px;
}
.al-tag.danger { background: rgba(255,71,87,0.2); color: var(--red); }
.al-tag.warning { background: rgba(255,169,64,0.2); color: var(--orange); }
.al-tag.info { background: rgba(59,158,255,0.2); color: var(--blue-light); }
.alert-item .al-title { font-size: 13px; font-weight: 600; margin: 4px 0; }
.alert-item .al-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.alert-item .al-time { font-size: 10px; color: var(--text-muted); margin-top: 6px; }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* 站点列表 */
.station-section { padding: 20px; overflow-y: auto; flex: 1 1 120px; }
.station-section h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--text-primary); }
.station-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  margin-bottom: 6px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.015); cursor: pointer;
  border: 1px solid transparent; transition: all 0.25s;
}
.station-row:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.06); }
.station-row.active { background: rgba(59,158,255,0.1); border-color: rgba(59,158,255,0.3); box-shadow: 0 0 16px rgba(59,158,255,0.08); }
.st-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  transition: box-shadow 0.3s;
}
.st-dot.good { background: var(--green); box-shadow: 0 0 8px var(--green-glow); }
.st-dot.warn { background: var(--orange); box-shadow: 0 0 8px var(--orange-glow); }
.st-dot.bad { background: var(--red); box-shadow: 0 0 8px var(--red-glow); animation: urgentBlink 1s infinite; }
.st-dot.off { background: var(--text-muted); box-shadow: none; }
@keyframes urgentBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
.st-info { flex: 1; }
.st-info .st-name { font-size: 13px; font-weight: 600; }
.st-info .st-region { font-size: 10px; color: var(--text-muted); }
.st-temp { font-size: 16px; font-weight: 700; text-align: right; }

/* ====== 底部图表 ====== */
.charts-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
  margin: 0 20px 12px;
  flex-shrink: 0;
}
.chart-box {
  padding: 14px 18px; height: 200px;
  display: flex; flex-direction: column;
}
.chart-box .chart-inner { flex: 1; min-height: 0; width: 100%; }
.chart-box h3 {
  font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.chart-box .chart-sub { font-size: 11px; color: var(--text-muted); }

/* ====== 状态栏 ====== */
.footer-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 24px; font-size: 11px; color: var(--text-muted);
  border-top: 1px solid rgba(255,255,255,0.04);
  background: rgba(8, 20, 50, 0.85);
}
.footer-bar .live-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); margin-right: 6px;
  box-shadow: 0 0 6px var(--green-glow);
  animation: pulse 1.8s infinite;
}
.status-bar { display: flex; align-items: center; gap: 8px; }
.status-ind {
  display: flex; align-items: center; gap: 4px; padding: 2px 10px;
  border-radius: 10px; font-size: 10px;
}
.status-ind.green { background: rgba(0,227,150,0.1); color: var(--green); }

/* ====== Toast 通知 ====== */
.toast {
  position: fixed; top: 24px; right: 24px; z-index: 9999;
  padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 500;
  border: 1px solid rgba(255,255,255,0.1);
  animation: toastIn 0.4s ease-out, toastOut 0.3s 2.5s ease-in forwards;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
}
.toast.success { background: rgba(0,227,150,0.12); color: var(--green); border-color: rgba(0,227,150,0.25); }
.toast.error { background: rgba(255,71,87,0.12); color: var(--red); border-color: rgba(255,71,87,0.25); }
.toast.info { background: rgba(59,158,255,0.12); color: var(--blue-light); border-color: rgba(59,158,255,0.25); }
.toast.warning { background: rgba(255,169,64,0.12); color: var(--orange); border-color: rgba(255,169,64,0.25); }
@keyframes toastIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-20px); } }

/* ====== 滚动条 ====== */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }

/* ====== 响应式 ====== */
@media (max-width: 1200px) {
  .main-grid { grid-template-columns: 1fr; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .charts-row { grid-template-columns: 1fr; }
  .side-panel { display: none; }
}

/* 平板 & 小屏 */
@media (max-width: 768px) {
  .header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
  .header-icon { width: 34px; height: 34px; border-radius: 10px; font-size: 18px; }
  .header-title h1 { font-size: 16px; }
  .header-title span { font-size: 10px; letter-spacing: 1px; }
  .header-right { gap: 8px; }
  .clock { padding: 6px 12px; font-size: 11px; }
  .btn { padding: 8px 16px; font-size: 12px; }
  .btn-text { display: none; } /* 按钮只留图标 */
  .main-grid { padding: 12px; gap: 12px; }
  .map-wrap { min-height: 320px; }
  .charts-row { padding: 0 12px 12px; }
  .chart-box { height: auto; min-height: 220px; }
  .footer-bar { flex-wrap: wrap; gap: 6px; padding: 8px 16px; font-size: 10px; }
  .toast { top: 12px; right: 12px; left: 12px; padding: 12px 18px; font-size: 13px; border-radius: 10px; }
}

/* 手机 */
@media (max-width: 480px) {
  .app { height: auto; min-height: 100dvh; overflow-y: auto; }
  .header { padding: 10px 12px; }
  .header-brand { gap: 8px; }
  .header-icon { width: 28px; height: 28px; border-radius: 8px; font-size: 16px; }
  .header-title h1 { font-size: 14px; letter-spacing: 0; }
  .header-title span { display: none; }
  .header-right { gap: 4px; }
  .clock { display: none; }
  .btn { padding: 7px 12px; font-size: 11px; border-radius: 18px; }
  .btn-text { display: none; }
  .main-grid { padding: 8px; gap: 8px; }
  .stat-row { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .stat-card { padding: 12px; }
  .stat-value { font-size: 20px; }
  .map-wrap { min-height: 260px; border-radius: var(--radius-md); }
  .side-panel {
    display: flex !important; flex-direction: column; gap: 10px;
  }
  .side-panel .glass { max-height: none; }
  .charts-row { padding: 0 8px 8px; gap: 8px; }
  .chart-box { min-height: 200px; border-radius: var(--radius-md); padding: 14px; }
  .chart-box h3 { font-size: 12px; }
  .footer-bar { flex-direction: column; align-items: flex-start; padding: 6px 12px; }
}
</style>
</head>
<body>

<!-- 主应用 -->
<div class="app">

  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-brand">
      <div class="header-icon">🌊</div>
      <div class="header-title">
        <h1>海洋温度异常预警监测平台</h1>
        <span>辽宁理工学院</span>
      </div>
    </div>
    <div class="header-right">
      <div class="clock"><span class="dot"></span><span id="clockText">--</span></div>
      <button class="btn btn-secondary" onclick="refreshAll()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.5 15.5a9 9 0 1 0 3.2-10.3L1 10"/></svg>
        <span class="btn-text">同步最新数据</span>
      </button>
      <button class="btn btn-amber" onclick="runAnalysis()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/><path d="M12 3v3"/><path d="M4 2l4 8h8l4-8"/></svg>
        <span class="btn-text">执行智能分析</span>
      </button>
    </div>
  </header>

  <!-- 主内容区 -->
  <div class="main-grid">
    <!-- 左侧 -->
    <div class="left-column" style="display:flex;flex-direction:column;gap:16px;min-height:0;">
      <!-- 四张统计卡片 -->
      <div class="stat-row">
        <div class="stat-card glass">
          <span class="stat-icon">📡</span>
          <div class="stat-label">监测站点</div>
          <div class="stat-value" style="color:var(--blue-light)" id="cardStations">8</div>
          <div class="stat-footnote">覆盖中国近海全海域</div>
          <div class="stat-accent accent-blue"></div>
        </div>
        <div class="stat-card glass">
          <span class="stat-icon">🌡️</span>
          <div class="stat-label">近海最高温度</div>
          <div class="stat-value" id="cardMaxTemp" style="color:var(--orange)">--</div>
          <div class="stat-footnote" id="cardMaxStation">加载中...</div>
          <div class="stat-accent accent-orange"></div>
        </div>
        <div class="stat-card glass">
          <span class="stat-icon">🔔</span>
          <div class="stat-label">活跃预警</div>
          <div class="stat-value" id="cardAlerts" style="color:var(--green)">0</div>
          <div class="stat-footnote">过去 24 小时内</div>
          <div class="stat-accent accent-green"></div>
        </div>
        <div class="stat-card glass">
          <span class="stat-icon">📋</span>
          <div class="stat-label">综合评分</div>
          <div class="stat-value" id="cardScore" style="color:var(--green)">--</div>
          <div class="stat-footnote" id="cardScoreLabel">待分析</div>
          <div class="stat-accent accent-green"></div>
        </div>
      </div>

      <!-- 地图 -->
      <div class="map-wrap">
        <div id="map"></div>
      </div>
    </div>

    <!-- 右侧 -->
    <div class="side-panel">
      <div class="report-section glass" id="reportSection">
        <h3>📋 预警报告 <span class="report-score" id="reportScore">--</span></h3>
        <div id="reportBody">
          <div class="alert-empty">
            <div class="icon">🔍</div>
            <div style="font-size:13px;">尚未生成报告</div>
            <div style="font-size:11px;margin-top:4px;color:var(--text-muted);">点击顶部「执行智能分析」生成</div>
          </div>
        </div>
      </div>
      <div class="alert-section glass">
        <h3>⚠️ 实时预警<span class="alert-count" id="alertBadge">0</span></h3>
        <div id="alertList">
          <div class="alert-empty">
            <div class="icon">✅</div>
            <div style="font-size:13px;">当前无预警信息</div>
            <div style="font-size:11px;margin-top:4px;color:var(--text-muted);">各海域温度处于正常范围</div>
          </div>
        </div>
      </div>
      <div class="station-section glass">
        <h3>📍 沿海监测站点</h3>
        <div id="stationList"></div>
      </div>
    </div>
  </div>

  <!-- 底部图表 -->
  <div class="charts-row">
    <div class="chart-box glass">
      <h3>📈 七日温度趋势<span class="chart-sub" id="chartSub">— 点击地图站点查看详情</span></h3>
      <div class="chart-inner" id="chartTrend"></div>
    </div>
    <div class="chart-box glass">
      <h3>📊 全海域温度对比</h3>
      <div class="chart-inner" id="chartCompare"></div>
    </div>
  </div>

  <!-- 底部状态栏 -->
  <div class="footer-bar">
    <div style="display:flex;align-items:center;gap:12px;">
      <span><span class="live-dot"></span>系统运行中</span>
      <span class="status-bar">
        <span class="status-ind green" id="apiStatus">● 数据连接正常</span>
      </span>
    </div>
    <span>© 2026 OceanTempGuard · 海洋温度异常预警监测平台 v2.0</span>
  </div>

</div>

<script>
// APP_VERSION: 2026.11.03-r7
const APP_VERSION = '2026.11.03-r7';

// ============================================================
// 全局状态
// ============================================================
let currentStationId = 1;
let stationsData = [];
let trendChart, compareChart;
let map, markers = {};
let prevAlertCount = 0;

// ============================================================
// 工具函数
// ============================================================
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ============================================================
// Toast 通知
// ============================================================
function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ============================================================
// 时钟
// ============================================================
function tick() {
  document.getElementById('clockText').textContent =
    new Date().toLocaleString('zh-CN', { hour12: false, year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit' });
}
tick(); setInterval(tick, 1000);

// ============================================================
// 地图
// ============================================================
function initMap() {
  map = L.map('map', {
    center: [30, 118], zoom: 5, zoomControl: false, attributionControl: false,
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  // ArcGIS 海洋底图（国内可达，主题契合）+ 海岸线/标注参考层
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 12,
    attribution: '&copy; Esri, GEBCO, NOAA',
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 12,
    attribution: '&copy; Esri',
  }).addTo(map);
  // 地图染色：降低亮度 + 偏蓝 + 降低饱和度 → 融入深色海洋背景
  const mapStyle = document.createElement('style');
  mapStyle.textContent = '.leaflet-tile { filter: brightness(0.55) saturate(0.3) hue-rotate(170deg) !important; }';
  document.head.appendChild(mapStyle);
}

function updateMapMarkers(data) {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  data.forEach(st => {
    const statusColor = st.status === 'danger' ? '#ff4757' : st.status === 'warning' ? '#ffa940' : st.status === 'nodata' ? '#4a6580' : '#00e396';
    const pulseAnim = st.status === 'danger' ? 'markerRipple 1s infinite' : 'none';
    const icon = L.divIcon({
      className: '',
      html: `<div class="marker-pin" style="background:${statusColor};box-shadow:0 0 20px ${statusColor};${pulseAnim.startsWith('marker') ? `animation:${pulseAnim}` : ''}">🌊</div>`,
      iconSize: [44,44], iconAnchor: [22,22],
    });
    const m = L.marker([st.lat, st.lon], { icon }).addTo(map).bindPopup(`
      <div style="color:#e8f0fe;font-size:13px;min-width:140px;">
        <b style="color:#5eb8ff;font-size:15px;">${st.name}</b>
        <div style="margin:6px 0;display:flex;align-items:baseline;gap:6px;">
          <span style="color:#89a4c7;">当前温度</span>
          <span style="font-size:20px;font-weight:700;color:${statusColor};">
            ${st.current_temp != null ? st.current_temp + '℃' : '—'}
          </span>
        </div>
        <div style="font-size:11px;color:#4a6580;">${st.region} · 近24h告警 ${st.alert_count} 条</div>
      </div>
    `);
    m.on('click', () => selectStation(st.id));
    markers[st.id] = m;
  });
}

// ============================================================
// ECharts
// ============================================================
const chartDark = {
  textStyle: { color: '#89a4c7' },
  grid: { top: 10, right: 25, bottom: 28, left: 48 },
  xAxis: { axisLabel: { color: '#4a6580', fontSize: 10 }, axisLine: { lineStyle: { color: '#1a3050' } }, axisTick: { show: false } },
  yAxis: { axisLabel: { color: '#4a6580' }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.04)' } }, nameTextStyle: { color: '#4a6580', fontSize: 11 } },
};

function initCharts() {
  trendChart = echarts.init(document.getElementById('chartTrend'));
  compareChart = echarts.init(document.getElementById('chartCompare'));
  trendChart.setOption({
    ...chartDark,
    tooltip: { trigger: 'axis', backgroundColor: 'rgba(8,24,58,0.95)', borderColor: 'rgba(64,158,255,0.3)', textStyle: { color: '#e8f0fe', fontSize: 12 } },
    xAxis: { ...chartDark.xAxis, type: 'category', data: [], boundaryGap: false },
    yAxis: { ...chartDark.yAxis, type: 'value', name: '℃', min: 'dataMin' },
    series: [{
      data: [], type: 'line', smooth: true, symbol: 'none', lineStyle: { color: '#3b9eff', width: 2.5 },
      areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1, [
        { offset: 0, color: 'rgba(59,158,255,0.3)' }, { offset: 1, color: 'rgba(59,158,255,0.02)' }
      ]) },
      markLine: {
        silent: true, symbol: 'none', lineStyle: { color: '#ff4757', type: 'dashed', width: 1.5, opacity: 0.7 },
        label: { color: '#ff4757', fontSize: 10, formatter: '高温阈值 30℃' },
        data: [{ yAxis: 30 }]
      }
    }]
  });
}

// ============================================================
// 数据加载
// ============================================================
async function loadOverview() {
  try {
    const resp = await fetch('/api/overview');
    stationsData = await resp.json();
    updateMapMarkers(stationsData);
    updateStationList(stationsData);
    updateStatCards(stationsData);
    if (stationsData.length > 0 && stationsData.find(s => s.id === currentStationId)?.current_temp != null) {
      loadStationChart(currentStationId);
    }
  } catch(e) {
    console.error('数据加载失败:', e);
    document.getElementById('apiStatus').innerHTML = '● 数据连接异常';
    document.getElementById('apiStatus').className = 'status-ind';
  }
  loadAlerts();
}

async function loadStationChart(stationId) {
  try {
    const resp = await fetch(`/api/sst/${stationId}?hours=168`);
    const data = await resp.json();
    if (data.error) return;
    const times = data.times.map(t => t.substring(5, 16).replace('T',' '));
    const step = Math.max(1, Math.floor(times.length / 50));
    const sampledT = times.filter((_,i) => i % step === 0);
    const sampledV = data.temps.filter((_,i) => i % step === 0);
    trendChart.setOption({
      xAxis: { data: sampledT },
      series: [{ data: sampledV, markLine: { data: [{ yAxis: 30 }] } }]
    });
    const st = stationsData.find(s => s.id === stationId);
    document.getElementById('chartSub').textContent = st ? `— ${st.name} · 近7日逐时温度` : '';
  } catch(e) { console.error(e); }
}

async function loadAlerts() {
  try {
    const resp = await fetch('/api/alerts?limit=20');
    const alerts = await resp.json();
    const badge = document.getElementById('alertBadge');
    badge.textContent = alerts.length;
    const container = document.getElementById('alertList');
    if (alerts.length === 0) {
      container.innerHTML = `<div class="alert-empty"><div class="icon">✅</div><div style="font-size:13px;">当前无预警信息</div><div style="font-size:11px;margin-top:4px;color:var(--text-muted);">各海域温度处于正常范围</div></div>`;
      document.getElementById('cardAlerts').style.color = 'var(--green)';
    } else {
      container.innerHTML = alerts.slice(0, 10).map((a, i) => {
        const lv = a.alert_level === 'danger' ? 'lv-danger' : a.alert_level === 'info' ? 'lv-info' : '';
        const tagCls = a.alert_level === 'danger' ? 'danger' : a.alert_level === 'info' ? 'info' : 'warning';
        const t = a.target_time ? a.target_time.substring(0, 16).replace('T', ' ') : '';
        return `<div class="alert-item ${lv}" style="animation-delay:${i*0.05}s">
          <span class="al-tag ${tagCls}">${a.alert_type}</span>
          <div class="al-title">${a.station_name} · ${a.temperature}℃</div>
          <div class="al-desc">${a.message}</div>
          <div class="al-time">${t}</div>
        </div>`;
      }).join('');
      const dangerCount = alerts.filter(a => a.alert_level === 'danger').length;
      const alertEl = document.getElementById('cardAlerts');
      alertEl.style.color = dangerCount > 0 ? 'var(--red)' : 'var(--orange)';
    }
    // 告警变化动画
    if (alerts.length !== prevAlertCount && alerts.length > 0) {
      badge.style.transform = 'scale(1.3)';
      setTimeout(() => badge.style.transform = '', 300);
    }
    prevAlertCount = alerts.length;
  } catch(e) {}
}

function updateStatCards(data) {
  const valid = data.filter(s => s.current_temp != null);
  if (valid.length > 0) {
    const maxTemp = Math.max(...valid.map(s => s.current_temp));
    const maxSt = valid.find(s => s.current_temp === maxTemp);
    const el = document.getElementById('cardMaxTemp');
    el.textContent = maxTemp + '℃';
    el.style.color = maxTemp >= 30 ? 'var(--red)' : 'var(--orange)';
    el.classList.add('num-animate');
    setTimeout(() => el.classList.remove('num-animate'), 400);
    document.getElementById('cardMaxStation').textContent = `最高位于 ${maxSt.name}`;
  }
  document.getElementById('cardStations').textContent = data.length;
  document.getElementById('apiStatus').innerHTML = '● 数据连接正常';
  document.getElementById('apiStatus').className = 'status-ind green';

  // 对比图
  const names = data.map(s => s.name);
  const temps = data.map(s => s.current_temp || 0);
  const avgs = data.map(s => s.avg_24h || 0);
  compareChart.setOption({
    ...chartDark,
    tooltip: { trigger: 'axis', backgroundColor: 'rgba(8,24,58,0.95)', borderColor: 'rgba(64,158,255,0.3)', textStyle: { color: '#e8f0fe' } },
    legend: { textStyle: { color: '#4a6580', fontSize: 11 }, top: 0, right: 0 },
    xAxis: { ...chartDark.xAxis, type: 'category', data: names, axisLabel: { ...chartDark.xAxis.axisLabel, rotate: 25 } },
    yAxis: { ...chartDark.yAxis, type: 'value', name: '℃' },
    series: [
      { name: '当前温度', type: 'bar', data: temps, barWidth: 14, itemStyle: { borderRadius: [4,4,0,0],
        color: p => p.value >= 30 ? '#ff4757' : p.value >= 25 ? '#ffa940' : '#3b9eff' }},
      { name: '24h 均值', type: 'bar', data: avgs, barWidth: 14, itemStyle: { borderRadius: [4,4,0,0], color: 'rgba(59,158,255,0.25)' }},
    ]
  });
}

function updateStationList(data) {
  document.getElementById('stationList').innerHTML = data.map(s => {
    const dotCls = s.status === 'danger' ? 'bad' : s.status === 'warning' ? 'warn' : s.status === 'nodata' ? 'off' : 'good';
    const tColor = s.status === 'danger' ? 'var(--red)' : s.status === 'warning' ? 'var(--orange)' : s.status === 'nodata' ? 'var(--text-muted)' : 'var(--green)';
    return `<div class="station-row ${s.id===currentStationId?'active':''}" onclick="selectStation(${s.id})">
      <span class="st-dot ${dotCls}"></span>
      <div class="st-info"><div class="st-name">${s.name}</div><div class="st-region">${s.region}</div></div>
      <span class="st-temp" style="color:${tColor}">${s.current_temp!=null?s.current_temp+'℃':'—'}</span>
    </div>`;
  }).join('');
}

function selectStation(id) {
  currentStationId = id;
  loadStationChart(id);
  updateStationList(stationsData);
  const st = stationsData.find(s => s.id === id);
  if (st) {
    map.setView([st.lat, st.lon], 7, { animate: true, duration: 0.6 });
    if (markers[id]) markers[id].openPopup();
  }
}

// ============================================================
// 按钮操作
// ============================================================
async function refreshAll() {
  const btn = document.querySelector('.btn-secondary');
  const orig = btn.innerHTML;
  btn.innerHTML = '<span style="animation:spin 0.8s linear infinite">⟳</span> 启动中...';
  btn.style.pointerEvents = 'none';
  
  // 1. 启动后台刷新
  let startData;
  try {
    const startResp = await fetch('/api/refresh', { method: 'POST' });
    startData = await startResp.json();
  } catch (e) {
    showToast('无法连接服务器，请稍后重试', 'error');
    btn.innerHTML = orig; btn.style.pointerEvents = '';
    return;
  }
  
  if (startData.status === 'running') {
    showToast('刷新任务已在执行中，请稍候', 'info');
  }
  
  // 2. 轮询等待完成
  let attempts = 0;
  let lastError = null;
  btn.innerHTML = '<span style="animation:spin 0.8s linear infinite">⟳</span> 拉取Open-Meteo数据中...';
  
  while (attempts < 60) {
    attempts++;
    await sleep(2000);
    try {
      const statusResp = await fetch('/api/refresh_status?_cb=' + Date.now());
      const statusData = await statusResp.json();
      lastError = null;
      
      if (!statusData.running) {
        if (statusData.error) {
          showToast(`刷新出错: ${statusData.error}`, 'error');
          break;
        }
        const results = statusData.results;
        if (!results) { showToast('刷新完成，无新数据', 'warning'); break; }
        const ok = results.filter(x => x.success).length;
        showToast(`数据同步完成 · ${ok}/${results.length} 个站点更新成功`, ok === results.length ? 'success' : 'error');
        await loadOverview();
        if (stationsData.length > 0) loadStationChart(currentStationId);
        break;
      }
      // still running, update button text
      btn.innerHTML = '<span style="animation:spin 0.8s linear infinite">⟳</span> 拉取中... (' + attempts + '/60)';
    } catch (e) {
      lastError = e;
      btn.innerHTML = '<span style="animation:spin 0.8s linear infinite">⟳</span> 重试中... (' + attempts + '/60)';
    }
  }
  
  if (attempts >= 60) {
    if (lastError) {
      showToast('服务器响应超时（Render 冷启动中），后台仍在刷新，请稍后点同步按钮重试', 'warning');
    } else {
      showToast('刷新超时，请重试', 'warning');
    }
  }
  
  btn.innerHTML = orig; btn.style.pointerEvents = '';
}

async function runAnalysis() {
  const btn = document.querySelector('.btn-amber');
  const orig = btn.innerHTML;
  btn.innerHTML = '<span style="animation:spin 0.8s linear infinite">⟳</span> 分析中...';
  btn.style.pointerEvents = 'none';
  try {
    const resp = await fetch('/api/run_analysis', { method: 'POST' });
    const r = await resp.json();
    if (r.report) {
      renderReport(r.report);
      const alertCount = r.report.stations.reduce((n, s) => n + s.alerts.length, 0);
      showToast(`智能分析完成 · 综合评分 ${r.report.overall_score} 分 · ${alertCount} 条异常`, 'success');
    } else {
      showToast('分析完成 · 当前各海域温度均在正常范围');
    }
    loadAlerts();
    loadOverview();
  } catch(e) {
    showToast('分析执行失败', 'error');
  } finally {
    btn.innerHTML = orig; btn.style.pointerEvents = '';
  }
}

function renderReport(report) {
  document.getElementById('reportScore').textContent = report.overall_score + '分';
  const cardScore = document.getElementById('cardScore');
  cardScore.textContent = report.overall_score;
  const levelColors = { normal: 'var(--green)', watch: 'var(--blue-light)', warning: 'var(--orange)', danger: 'var(--red)' };
  cardScore.style.color = levelColors[report.overall_level] || 'var(--green)';
  document.getElementById('cardScoreLabel').textContent = report.overall_label;
  document.getElementById('reportScore').style.background =
    report.overall_level === 'danger' ? 'rgba(255,71,87,0.2)' :
    report.overall_level === 'warning' ? 'rgba(255,169,64,0.2)' :
    report.overall_level === 'watch' ? 'rgba(59,158,255,0.2)' : 'rgba(0,227,150,0.15)';
  document.getElementById('reportScore').style.color = levelColors[report.overall_level];

  const rows = report.stations.map(s => {
    const scoreColor = s.score >= 80 ? 'var(--green)' : s.score >= 60 ? 'var(--blue-light)' : s.score >= 40 ? 'var(--orange)' : 'var(--red)';
    return `<div class="report-station-row">
      <span class="rs-name">${s.name}</span>
      <span class="rs-level ${s.level}">${s.label}</span>
      <span class="rs-score" style="color:${scoreColor}">${s.score}</span>
    </div>`;
  }).join('');

  document.getElementById('reportBody').innerHTML = `
    <div class="report-summary">${report.summary}</div>
    <div class="report-stations">${rows}</div>
    <div style="font-size:10px;color:var(--text-muted);margin-top:8px;">
      生成于 ${report.generated_at ? report.generated_at.substring(0,19).replace('T',' ') : ''}
    </div>`;
}

async function loadReport() {
  try {
    const resp = await fetch('/api/report');
    const r = await resp.json();
    if (r.status === 'ok' && r.report) renderReport(r.report);
  } catch(e) {}
}

// ============================================================
// 启动
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  initCharts();
  loadOverview();
  loadReport();
  setInterval(loadOverview, 300000);
});

window.addEventListener('resize', () => {
  trendChart?.resize(); compareChart?.resize(); map?.invalidateSize();
});
</script>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

</body>
</html>
